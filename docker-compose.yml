services:
  # -------------------------------------------------------------
  # Cloud Server Tier (Central Telemetry Collector & Health Check)
  # -------------------------------------------------------------
  collector-service:
    image: ${IMAGE_NAME:-python-grpc}:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m python_grpc.apps.collector --host 0.0.0.0 --port 50051
    ports:
      - "50051:50051"
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    networks:
      cloud-tier:
        aliases:
          - collector.internal
    restart: unless-stopped


  # -------------------------------------------------------------
  # External Consumer Tier (Simulates REST Consumer on Host 3)
  # -------------------------------------------------------------
  rest-gateway:
    image: ${IMAGE_NAME:-python-grpc}:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m python_grpc.apps.rest_gateway --host 0.0.0.0 --port 8000 --grpc-target collector.internal:50051
    ports:
      - "8000:8000"
    depends_on:
      - collector-service
    environment:
      - GRPC_TARGET=collector.internal:50051
    networks:
      cloud-tier:
    restart: unless-stopped

  # -------------------------------------------------------------
  # MQTT Broker (Industrial Standard IoT Messaging Tier)
  # -------------------------------------------------------------
  mqtt-broker:
    image: eclipse-mosquitto:2.0
    command: mosquitto -c /mosquitto-no-auth.conf
    ports:
      - "1883:1883"
    networks:
      edge-tier:
        aliases:
          - broker.internal
      cloud-tier:
    restart: unless-stopped

  # -------------------------------------------------------------
  # IoT Microcontroller Sensor Node (Simulates ESP32 + PZEM-004T)
  # -------------------------------------------------------------
  mqtt-sensor-node:
    image: ${IMAGE_NAME:-python-grpc}:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m python_grpc.apps.mqtt_sensor_node --broker-host broker.internal --broker-port 1883 --device-id ESP32-PZEM-01 --count 5
    depends_on:
      - mqtt-broker
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    networks:
      edge-tier:
    restart: unless-stopped

  # -------------------------------------------------------------
  # MQTT-to-gRPC Bridge Service (Translates MQTT pub/sub to gRPC)
  # -------------------------------------------------------------
  mqtt-bridge:
    image: ${IMAGE_NAME:-python-grpc}:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m python_grpc.apps.mqtt_bridge --mqtt-host broker.internal --mqtt-port 1883 --grpc-target collector.internal:50051
    depends_on:
      - mqtt-broker
      - collector-service
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    networks:
      edge-tier:
      cloud-tier:
    restart: unless-stopped

networks:
  cloud-tier:
    name: cloud-tier-network
    driver: bridge
  edge-tier:
    name: edge-tier-network
    driver: bridge
