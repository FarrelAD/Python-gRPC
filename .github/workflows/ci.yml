name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint, Type Check & Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --all-groups

      - name: Verify Protobuf stub freshness (no uncommitted diffs)
        run: |
          poetry run python scripts/gen_proto.py
          git diff --exit-code || (echo "Error: Generated protobuf stubs are out of sync with pzem_004t.proto. Run scripts/gen_proto.py and commit." && exit 1)

      - name: Run strict type checking (Pyrefly)
        run: poetry run pyrefly check

      - name: Run automated test suite
        run: poetry run python -m unittest discover -s tests -v
