[project]
name = "python-grpc"
version = "0.1.0"
description = ""
authors = [
    {name = "Farrel Augusta Dinata",email = "farrel.apeiron@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "grpcio (>=1.83.0,<2.0.0)",
    "grpcio-tools (>=1.83.0,<2.0.0)",
    "protobuf (>=7.35.1,<8.0.0)"
]

[tool.poetry]
packages = [{include = "python_grpc", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
